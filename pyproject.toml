[project]
name = "easylm-nathan"
version = "0.1.0.dev016"
authors = []
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flax",
    "optax",
    "prometheus_client",
    "termcolor",
    "torch>=2.5.0",
    "tqdm",
    "transformers",
    "uvicorn",
    "uvloop",
    "numpy==1.26.4",
    "scipy==1.12.0",
    "jax-smi",
    "sentencepiece",
    "wandb",
    "mlxu",
    # { version = "^4.9.6", optional = true, name = "tensorflow-datasets" },
    # { version = "^2.18.0", optional = true, name = "tensorflow-cpu" },
    # { version = "^2.18.0", optional = true, name = "tensorboard" },
    # { version = "^3.2.0", optional = true, name = "datasets" },
    "datasets",
    # "jax[tpu]==0.4.13",
    "einops>=0.8.0",
    "jax[tpu]==0.4.13",
]
scripts = { llama_train_ppo = "EasyLM.models.llama.llama_train_ppo:main_cli" }

[tool.setuptools.packages.find]
where = ["EasyLM"]  # Explicitly specify the root package directory
include = ["EasyLM*"]  # Include all submodules
